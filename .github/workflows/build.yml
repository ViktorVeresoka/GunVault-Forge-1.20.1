name: Build GunVault Forge 1.20.1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -o gunvault-ci-payload.zip -d .
      - name: Install Minecraft resource pack metadata
        run: |
          install -m 644 pack.mcmeta src/main/resources/pack.mcmeta
          python3 -c "import json; assert json.load(open('src/main/resources/pack.mcmeta'))['pack']['pack_format'] == 15"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Static validation
        run: python3 tests/sanity.py
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Forge mod
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify JAR and in-game resource metadata
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          jar = Path("build/libs/gunvault-forge-1.20.1-1.0.0.jar")
          assert jar.stat().st_size > 0
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              metadata = json.loads(z.read("pack.mcmeta"))
              assert metadata["pack"]["pack_format"] == 15
              for name in ("glock17", "glock17_magazine", "ammo_9mm"):
                  assert f"assets/gunvault/models/item/{name}.json" in z.namelist()
              assert "META-INF/mods.toml" in z.namelist()
          print("PASS: compiled JAR contains valid Minecraft 1.20.1 pack.mcmeta and all item models")
          PY
      - name: Publish JAR
        uses: actions/upload-artifact@v4
        with:
          name: GunVault-Forge-1.20.1-FIXED
          path: build/libs/gunvault-forge-1.20.1-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
