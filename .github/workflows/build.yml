name: Build GunVault Forge 1.20.1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -o gunvault-ci-payload.zip -d .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Static validation
        run: python3 tests/sanity.py
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Forge mod
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify JAR
        run: |
          test -s build/libs/gunvault-forge-1.20.1-1.0.0.jar
          unzip -t build/libs/gunvault-forge-1.20.1-1.0.0.jar | tail -1
      - name: Publish JAR
        uses: actions/upload-artifact@v4
        with:
          name: GunVault-Forge-1.20.1
          path: build/libs/gunvault-forge-1.20.1-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
